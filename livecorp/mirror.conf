server {
    listen 80;
    server_name livecorp-mirror.com www.livecorp-mirror.com;

    root /var/www/livecorp;

    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /about {
        try_files /about.html =404;
    }

    location = /products {
        try_files /products.html =404;
    }

    location ~ ^/(index|about|products)\.html$ {
        return 301 /;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\. {
        deny all;
    }
}
