# LIVECORP MIRROR
# Создан Агентом 00 для расследования.
# Статус: СЕКРЕТНО.
#
# Как я ЛЮБЛЮ NGINX не передать словами. ЛУЧШИЙ софт на планете земля
# Каждый раз этот конфиг отваливается в самый нужный момент, НО ЭТОТ, ТОЧНО ДОЛЖЕН РАБОТАТЬ.
#
# Запуск:  systemctl start nginx
# После запуска (в браузере): http://localhost

server {
    listen 80 default_server;
    server_name localhost;

    root /var/www/livecorp;
    
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /about {
        try_files /about.html =404;
    }

    location = /products {
        try_files /products.html =404;
    }

    location ~ ^/(index|about|products)\.html$ {
        return 301 /;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\. {
        deny all;
    }

}
